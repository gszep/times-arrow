<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Can collisions make a local clock?</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1420;color:#e4edf4;font:14px system-ui,sans-serif}body{height:100dvh;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);display:grid;grid-template-rows:30px minmax(0,55fr) minmax(0,35fr) 30px 66px;gap:3px;max-width:650px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;font-size:13px}header span{color:#95a6b7;font-size:10px}canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none}#caption{margin:0;align-self:center;text-align:center;color:#f4cf72;font-size:12px;white-space:nowrap}#controls{display:grid;grid-template-columns:96px minmax(80px,1fr) 38px 76px;gap:6px;align-items:center}button{height:40px;border:1px solid #455264;border-radius:9px;background:#172333;color:#e4edf4;font:12px system-ui;cursor:pointer;padding:2px}#toggle{border-color:#f4cf72;color:#f4cf72;font-weight:700}label{display:grid;gap:2px;font-size:10px;text-align:center;color:#a9bbca}input{width:100%;min-width:0;accent-color:#f4cf72;margin:4px 0}button small{display:block;font-size:9px;color:#a9bbca}button:disabled{opacity:.45}
</style></head><body>
<header>A clock needs collisions?<span>exploration · c = 1 cell/step</span></header>
<canvas id="gas" aria-label="Density; tap to move the circle centre"></canvas>
<canvas id="plot" aria-label="Log-log partition entropy rate per area versus radius"></canvas>
<p id="caption">Starting WebGPU…</p>
<div id="controls"><button id="toggle" aria-pressed="true">Collisions on</button><label><span id="density">mean free path ≈ 2 cells</span><input id="rho" aria-label="Density" type="range" min="0.5" max="4" step="0.25"></label><button id="pause" aria-label="Pause">Ⅱ</button><button id="rewind">↶ Rewind<small>rewinds exactly</small></button></div>
<script type="module" src="./main.ts"></script></body></html>

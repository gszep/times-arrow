name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
      - name: Contract is fresh
        run: |
          lake exe timesarrow contract > contract.json
          git diff --exit-code contract.json
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Comparator (v4.34.0 tag), lean4export (project toolchain), landrun
        run: |
          go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          git clone -q https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          cd "$RUNNER_TEMP/lean4export"
          git checkout -q 076e8e57707e813375e8f9da8bf989799ace9680
          cp "$GITHUB_WORKSPACE/lean-toolchain" lean-toolchain
          lake build lean4export
          echo "$PWD/.lake/build/bin" >> "$GITHUB_PATH"
          git clone -q https://github.com/leanprover/comparator.git "$RUNNER_TEMP/comparator"
          cd "$RUNNER_TEMP/comparator"
          git checkout -q d03acab154d269c06e60e4de7e4cc85deebff94b
          lake build comparator
          echo "$PWD/.lake/build/bin" >> "$GITHUB_PATH"
      - name: Sandbox is engaged (landrun denies writes outside the allowed set)
        run: |
          set -euo pipefail
          # Comparator runs Submission's elaboration with
          #   --best-effort --ro / --rw /dev -ldd -add-exec --rwx <project>/.lake
          # so only .lake (and /dev) is writable. Re-run landrun with the same
          # filesystem restrictions: a write inside .lake must succeed, and a
          # write outside must fail. On a kernel without Landlock, --best-effort
          # silently drops the sandbox and the forbidden write would succeed.
          probe="$RUNNER_TEMP/sandbox-probe"
          mkdir -p "$probe/.lake"
          landrun --best-effort --ro / --rw /dev --ldd --add-exec \
            --rwx "$probe/.lake" -- /bin/sh -c "echo allowed > '$probe/.lake/allowed'"
          test -s "$probe/.lake/allowed"
          rm -f "$probe/forbidden"
          if landrun --best-effort --unrestricted-filesystem --ro / --rw /dev --ldd --add-exec \
              --rwx "$probe/.lake" -- /bin/sh -c "echo escaped > '$probe/forbidden'"; then
            echo "::error::landrun allowed a write outside the allowed set; the sandbox is not engaged"
            exit 1
          fi
          echo "landrun allowed the permitted write and denied the forbidden one"

      - name: Comparator certifies every proved claim against Challenge.lean
        run: |
          jq '{challenge_module: "Challenge", solution_module: "TimesArrow",
               theorem_names: [.claims[] | select(.status == "proved") | .name],
               permitted_axioms: .allowedAxioms}' contract.json > "$RUNNER_TEMP/comparator.json"
          lake env comparator "$RUNNER_TEMP/comparator.json" | tee "$RUNNER_TEMP/comparator.log"
          grep -q "Your solution is okay!" "$RUNNER_TEMP/comparator.log"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [lean, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
